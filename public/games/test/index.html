<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c11">
  <title>test</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f7fc;background:#090c11;color-scheme:dark}
    body{margin:0;min-height:100vh;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    main{width:min(100%,1040px);min-height:calc(100svh - 60px);margin:auto;display:flex;flex-direction:column;gap:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .brand{margin:0 0 3px;color:#91a2b7;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(36px,6vw,56px);letter-spacing:-.05em;line-height:1}
    .stats{display:flex;gap:10px}
    .stat{min-width:86px;padding:12px 18px;border:1px solid #26303e;border-radius:16px;background:#101620}
    .label{display:block;color:#a6b4c6;font-size:14px;margin-bottom:2px}
    .value{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}
    #field{position:relative;flex:1;min-height:240px;overflow:hidden;border:1px solid #273543;border-radius:24px;background:radial-gradient(ellipse at 50% 45%,#12242e 0%,#0d141e 70%)}
    .intro{position:absolute;inset:0;display:grid;place-content:center;gap:12px;padding:24px;text-align:center;pointer-events:none}
    .intro strong{font-size:clamp(24px,4vw,36px);letter-spacing:-.03em}
    .intro span{color:#a6b4c6;font-size:16px;line-height:1.5}
    #target{position:absolute;width:82px;height:82px;padding:0;border:2px solid #bbfaff;border-radius:50%;background:#42d8e9;color:#061417;box-shadow:0 0 0 8px #42d8e918,0 0 36px #42d8e925;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
    #target::after{content:"";position:absolute;inset:26px;border:3px solid currentColor;border-radius:50%}
    #target:active{background:#b2f8ff}
    button:focus-visible{outline:3px solid #fff;outline-offset:5px}
    [hidden]{display:none!important}
    footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 2px}
    #status{margin:0;color:#bdc8d7;font-size:16px;line-height:1.5;max-width:650px}
    #start{flex:none;min-width:156px;min-height:52px;border:0;border-radius:14px;padding:14px 24px;background:#42d8e9;color:#061417;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
    #start:disabled{background:#172e38;color:#a0bac5;cursor:default}
    @media(max-width:560px){main{gap:16px}header{gap:16px}.stats{gap:7px}.stat{min-width:73px;padding:10px 13px}.value{font-size:25px}footer{align-items:stretch;flex-direction:column;gap:12px}#status{min-height:48px}#start{width:100%}#field{min-height:260px}}
    @media(max-height:520px) and (min-width:561px){body{padding:14px}main{min-height:calc(100svh - 28px);gap:12px}h1{font-size:36px}.stat{padding:7px 16px}#field{min-height:140px}footer{gap:12px}}
  </style>
</head>
<body>
  <main aria-label="Tap target game">
    <header>
      <div><p class="brand">Kkeep</p><h1>test</h1></div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">Seconds</span><span class="value" id="time">20</span></div>
        <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
      </div>
    </header>
    <section id="field" aria-label="Play area">
      <div class="intro" id="intro"><strong id="headline">Ready, aim, tap.</strong><span id="hint">Hit as many targets as you can in 20 seconds.</span></div>
      <button id="target" type="button" aria-label="Hit target" hidden></button>
    </section>
    <footer>
      <p id="status" role="status">Tap Start game, then tap the glowing target. You can also use Enter or Space.</p>
      <button id="start" type="button">Start game</button>
    </footer>
  </main>
  <script>
    (()=>{
      'use strict';
      const field=document.getElementById('field'),target=document.getElementById('target');
      const start=document.getElementById('start'),intro=document.getElementById('intro');
      const scoreText=document.getElementById('score'),timeText=document.getElementById('time');
      const bestText=document.getElementById('best'),status=document.getElementById('status');
      const headline=document.getElementById('headline'),hint=document.getElementById('hint');
      const storageKey='kkeep:test:best';
      let score=0,best=0,playing=false,deadline=0,frame=0,lastSecond=20;
      try{const saved=Number(localStorage.getItem(storageKey));if(Number.isSafeInteger(saved)&&saved>0)best=saved;}catch{}
      bestText.textContent=String(best);
      function placeTarget(){
        const margin=12;
        const maxX=Math.max(0,field.clientWidth-target.offsetWidth-margin*2);
        const maxY=Math.max(0,field.clientHeight-target.offsetHeight-margin*2);
        target.style.left=(margin+Math.random()*maxX)+'px';
        target.style.top=(margin+Math.random()*maxY)+'px';
      }
      function finish(){
        if(!playing)return;
        playing=false;cancelAnimationFrame(frame);frame=0;
        target.hidden=true;timeText.textContent='0';intro.hidden=false;
        const newBest=score>best;
        if(newBest){best=score;bestText.textContent=String(best);try{localStorage.setItem(storageKey,String(best));}catch{}}
        headline.textContent=score+' '+(score===1?'target':'targets')+' hit';
        hint.textContent=newBest?'A new personal best. Can you beat it?':'Another round? Your next target is waiting.';
        status.textContent='Round complete. Your score is '+score+'.'+(newBest?' New best!':'');
        start.disabled=false;start.textContent='Play again';start.focus({preventScroll:true});
      }
      function tick(){
        if(!playing)return;
        const remaining=deadline-performance.now();
        if(remaining<=0){finish();return;}
        const seconds=Math.ceil(remaining/1000);
        if(seconds!==lastSecond){timeText.textContent=String(seconds);lastSecond=seconds;}
        frame=requestAnimationFrame(tick);
      }
      start.addEventListener('click',()=>{
        if(playing)return;
        score=0;scoreText.textContent='0';timeText.textContent='20';lastSecond=20;
        playing=true;deadline=performance.now()+20000;
        start.disabled=true;start.textContent='Playing…';intro.hidden=true;target.hidden=false;
        status.textContent='Keep hitting the target. The round lasts 20 seconds.';
        placeTarget();target.focus({preventScroll:true});frame=requestAnimationFrame(tick);
      });
      target.addEventListener('click',()=>{
        if(!playing)return;
        if(performance.now()>=deadline){finish();return;}
        score++;scoreText.textContent=String(score);placeTarget();
      });
      window.addEventListener('resize',()=>{if(playing)placeTarget();});
      document.addEventListener('visibilitychange',()=>{if(playing&&performance.now()>=deadline)finish();});
    })();
  </script>
</body>
</html>
